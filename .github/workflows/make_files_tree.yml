name: Fetch new content of tracked links and files

on:
  workflow_dispatch:
  schedule:
    - cron: '* * * * *'
  push:
    # trigger on updated linkbase
    branches:
      - main

# one running + one queued run; overlapping runs crawl the same content and race to push
concurrency:
  group: make-files-tree
  cancel-in-progress: false

jobs:
  fetch_new_content:
    name: Make files tree
    runs-on: ${{matrix.os}}
    continue-on-error: true
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: web
            os: macos-14

          - mode: web_res
            os: ubuntu-22.04

          - mode: web_tr
            os: ubuntu-22.04

          # TODO temporary disabled: the TELEGRAM_SESSION account is deactivated (401 USER_DEACTIVATED)
          # - mode: server
          #   os: ubuntu-22.04

          - mode: client
            os: macos-14

          # TODO temporary disabled: walletbot.me changed its webpack bundle layout
          # - mode: mini_app
          #   os: ubuntu-22.04

    steps:

      - name: Clone.
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Setup Python.
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Setup uv.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies.
        run: |
          uv pip install --system -r requirements.txt
          # pyrogram is built from git and only the server mode needs it
          if [ "${{ matrix.mode }}" = "server" ]; then
            uv pip install --system -r requirements-server.txt
          fi

      - name: Generate files tree.
        env:
          OUTPUT_FOLDER: "data_ci/"
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_SESSION_TEST: ${{ secrets.TELEGRAM_SESSION_TEST }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          MODE: ${{ matrix.mode }}
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          python make_files_tree.py
          rm -rf __pycache__

      - name: Prepare data.
        run: |
          # crawled content lives in the data branch; main has no data/ folder
          git sparse-checkout set data/${{ matrix.mode }}
          git fetch --depth=1 origin data
          git switch -C data FETCH_HEAD

      - name: Commit and push changes.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_mode_folder() {
            rm -rf data/${{ matrix.mode }}
            mkdir -p data
            cp -R data_ci/${{ matrix.mode }} data/${{ matrix.mode }}
            git add data/${{ matrix.mode }}
          }

          stage_mode_folder
          git commit -m "Update content of files" || exit 0

          # matrix jobs race to push the data branch. a shallow clone can't rebase onto the new tip,
          # so redo the commit on top of it; that's safe cuz every mode commits only its own folder
          for i in 1 2 3 4 5; do
            git push origin HEAD:data && exit 0
            git fetch --depth=1 origin data
            git reset --hard FETCH_HEAD
            stage_mode_folder
            git commit -m "Update content of files" || exit 0
          done
          exit 1
